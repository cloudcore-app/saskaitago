name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
          - os: windows-latest
            platform: windows
            artifacts: dist/*.exe
          - os: macos-latest
            platform: macos
            artifacts: dist/*.dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenjp2-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux installers
        if: matrix.platform == 'linux'
        run: pnpm run dist:linux

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: pnpm run dist:windows

      - name: Build universal macOS disk image
        if: matrix.platform == 'macos'
        run: pnpm run dist:mac

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaskaitaGO-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: SaskaitaGO-*
          path: dist/
          merge-multiple: true

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "SaskaitaGO $GITHUB_REF_NAME" --generate-notes
