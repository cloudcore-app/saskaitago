name: Desktop builds

# Linux and Windows installers are built locally (pnpm run dist:local).
# Only macOS needs a macOS runner, and it is billed at 10x, so it runs on demand or for a v* tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

  build-macos:
    name: Build macOS
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal macOS disk image
        run: pnpm run dist:mac

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaskaitaGO-macos
          path: dist/SaskaitaGO.dmg
          if-no-files-found: error
          retention-days: 30
