name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
          - os: windows-latest
            platform: windows
            artifacts: dist/*.exe
          - os: macos-latest
            platform: macos
            artifacts: dist/*.dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenjp2-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux installers
        if: matrix.platform == 'linux'
        run: pnpm run dist:linux

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: pnpm run dist:windows

      - name: Build universal macOS disk image
        if: matrix.platform == 'macos'
        run: pnpm run dist:mac

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaskaitaGO-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30
