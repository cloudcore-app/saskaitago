<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>SaskaitaGO — vietinė sąskaitų programa</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/responsive.css">
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="SaskaitaGO pradžia"><span class="brand-mark"><img class="brand-app-icon" src="/saskaitago-icon.svg" alt=""></span><span>Saskaita<span class="brand-light">GO</span></span></a>
      <div class="side-label">DARBO VIETA</div>
      <button class="nav-item" data-view="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="4" rx="1.5"/><rect x="13.5" y="10.5" width="7" height="10" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>Dashboard</button>
      <button class="nav-item active" data-view="invoices"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.75h7l4 4v12.5H7a2 2 0 0 1-2-2v-12a2.5 2.5 0 0 1 2-2.5Z"/><path d="M14 3.75v4h4M9 12h6M9 15.5h6"/></svg></span>Sąskaitos<span class="nav-count" id="navCount">0</span></button>
      <button class="nav-item" data-view="clients"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1.2A4.8 4.8 0 0 1 8.3 13h1.4a4.8 4.8 0 0 1 4.8 4.8V19M16 5.5a3 3 0 0 1 0 5.8M17 13.2a4.6 4.6 0 0 1 3.5 4.5V19"/></svg></span>Klientai</button>
      <button class="nav-item" data-view="settings-company"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6m4 0h6M4 12h2m4 0h10M4 18h8m4 0h4"/><circle cx="12" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></svg></span>Nustatymai</button>
      <div class="side-bottom">
        <div class="local-badge"><span></span><div><b>Veikia lokaliai</b><small>Duomenys lieka šiame kompiuteryje</small></div></div>
        <button class="profile-button" id="settingsButton"><span class="avatar" id="avatar">SG</span><span class="profile-text"><b id="profileName">Jūsų įmonė</b><small>Nustatymai</small></span><span class="settings-gear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6m4 0h6M4 12h2m4 0h10M4 18h8m4 0h4"/><circle cx="12" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></svg></span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb">Darbo vieta <span>/</span> <b id="pageCrumb">Sąskaitos</b></div><div class="top-actions"><a class="powered-by-topbar" href="https://cloudcore.lt" target="_blank" rel="noopener noreferrer"><span>POWERED BY</span><b>CLOUDCORE ↗</b></a><button class="icon-button" id="topSettings" aria-label="Nustatymai"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6m4 0h6M4 12h2m4 0h10M4 18h8m4 0h4"/><circle cx="12" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></svg></button></div></header>
      <section class="content" id="content"></section>
    </main>
  </div>
  <div id="onboardingRoot"></div>
  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
